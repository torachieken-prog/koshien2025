<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>センバツ甲子園 優勝予想</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Antique+Soft&family=M+PLUS+1p:wght@400;700;900&display=swap');
  :root{--crimson:#B01020;--crimson-dark:#7a0a15;--gold:#D4A017;--gold-light:#f0c84a;--cream:#F5EDD8;--ink:#1a0f08;--sand:#E8D9B8;--sky:#1a3a5c;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'M PLUS 1p',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;}
  header{background:linear-gradient(135deg,var(--crimson-dark),var(--crimson) 60%,#c8192e);color:white;text-align:center;padding:20px 16px 16px;position:relative;overflow:hidden;box-shadow:0 4px 20px rgba(176,16,32,.4);}
  header::after{content:'⚾';position:absolute;right:-20px;top:-20px;font-size:120px;opacity:.07;transform:rotate(20deg);}
  .header-sub{font-size:11px;letter-spacing:4px;color:var(--gold-light);margin-bottom:6px;font-weight:700;}
  header h1{font-family:'Zen Antique Soft',serif;font-size:clamp(20px,5vw,32px);letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.3);}
  .header-badge{display:inline-block;margin-top:8px;background:var(--gold);color:var(--crimson-dark);font-size:11px;font-weight:900;padding:3px 12px;border-radius:20px;}
  .loading-overlay{display:none;position:fixed;inset:0;background:rgba(245,237,216,.9);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:12px;}
  .loading-overlay.show{display:flex;}
  .spinner{width:40px;height:40px;border:4px solid var(--sand);border-top-color:var(--crimson);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{font-size:13px;font-weight:700;color:var(--crimson);letter-spacing:1px;}
  .sync-bar{background:var(--ink);color:rgba(255,255,255,.6);font-size:11px;text-align:center;padding:5px;letter-spacing:1px;transition:all .3s;}
  .sync-bar.ok{color:#a8d5a2;}
  .sync-bar.error{color:#ff8a8a;background:#5a1a1a;}
  .tabs-wrapper{background:var(--ink);padding:0 8px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;}
  .tabs-wrapper::-webkit-scrollbar{display:none;}
  .tabs{display:inline-flex;gap:2px;padding:8px 0 0;}
  .tab{display:inline-block;padding:8px 14px;font-size:13px;font-weight:700;color:rgba(255,255,255,.5);cursor:pointer;border-radius:6px 6px 0 0;transition:all .2s;font-family:'M PLUS 1p',sans-serif;background:transparent;border:none;white-space:nowrap;}
  .tab:hover{color:rgba(255,255,255,.8);background:rgba(255,255,255,.08);}
  .tab.active{color:var(--ink);background:var(--cream);font-weight:900;}
  .tab-rankings{color:var(--gold-light)!important;}
  .tab-rankings.active{background:var(--gold);color:var(--ink)!important;}
  .tab-admin{color:#a8d5a2!important;}
  .tab-admin.active{background:#2d5a27;color:white!important;}
  main{max-width:700px;margin:0 auto;padding:0 12px 80px;}
  .section-card{background:white;border-radius:12px;margin:16px 0;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden;}
  .section-header{background:linear-gradient(90deg,var(--sky),#254e7a);color:white;padding:10px 16px;font-size:13px;font-weight:700;letter-spacing:2px;}
  .section-header span{color:var(--gold-light);}
  .section-header.admin-header{background:linear-gradient(90deg,#2d5a27,#4a7c4e);}
  .step-label{padding:14px 16px 8px;font-size:12px;font-weight:900;color:var(--crimson);letter-spacing:2px;}
  .team-count{display:inline-block;background:var(--crimson);color:white;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:8px;font-weight:700;}
  .teams-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:8px 12px 16px;}
  @media(min-width:480px){.teams-grid{grid-template-columns:repeat(3,1fr);}}
  .team-btn{display:flex;flex-direction:column;align-items:center;padding:10px 6px 28px;border:2px solid var(--sand);border-radius:10px;background:var(--cream);cursor:pointer;transition:all .18s;font-family:'M PLUS 1p',sans-serif;position:relative;text-align:center;width:100%;}
  .team-btn:hover{border-color:var(--crimson);background:#fff5f5;transform:translateY(-1px);box-shadow:0 3px 10px rgba(176,16,32,.15);}
  .team-btn.selected{border-color:var(--crimson);background:var(--crimson);color:white;transform:translateY(-1px);box-shadow:0 4px 14px rgba(176,16,32,.35);}
  .team-btn .num{font-size:10px;font-weight:700;color:var(--gold);margin-bottom:1px;}
  .team-btn.selected .num{color:var(--gold-light);}
  .team-btn .tname{font-size:13px;font-weight:900;line-height:1.3;}
  .team-btn .pref{font-size:10px;color:rgba(0,0,0,.45);margin-top:1px;}
  .team-btn.selected .pref{color:rgba(255,255,255,.6);}
  .team-btn .check{display:none;position:absolute;top:5px;right:24px;width:16px;height:16px;background:var(--gold);border-radius:50%;font-size:10px;line-height:16px;text-align:center;color:white;font-weight:900;}
  .team-btn.selected .check{display:block;}
  .team-btn.disabled{opacity:.35;cursor:not-allowed;transform:none!important;}
  .team-btn.disabled:hover{border-color:var(--sand);background:var(--cream);box-shadow:none;}
  .grade-badge{display:inline-block;font-size:10px;font-weight:900;padding:1px 7px;border-radius:4px;margin-top:4px;letter-spacing:1px;}
  .grade-SA{background:#7a0a15;color:#f0c84a;}.grade-A{background:#1a3a5c;color:white;}.grade-B{background:#4a7c4e;color:white;}.grade-C{background:#888;color:white;}
  .info-btn{position:absolute;bottom:6px;left:6px;right:6px;height:20px;border-radius:5px;background:rgba(0,0,0,.1);color:rgba(0,0,0,.5);font-size:10px;font-weight:700;line-height:20px;text-align:center;cursor:pointer;border:none;font-family:'M PLUS 1p',sans-serif;}
  .team-btn.selected .info-btn{background:rgba(255,255,255,.2);color:rgba(255,255,255,.8);}
  .selected-list{padding:0 12px 16px;}
  .sel-item{display:flex;align-items:center;background:var(--cream);border-radius:10px;padding:10px 14px;margin-bottom:6px;border:1px solid var(--sand);gap:10px;}
  .sel-name{flex:1;font-size:14px;font-weight:900;}
  .sel-diff{font-size:20px;font-weight:900;min-width:50px;text-align:right;}
  .sel-diff.plus{color:var(--crimson);}.sel-diff.minus{color:#1a3a5c;}.sel-diff.zero{color:#888;}
  .sel-rounds{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
  .sel-round-badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700;background:var(--sand);color:var(--ink);}
  .sel-round-badge.played{background:#1a3a5c;color:white;}
  .save-btn{display:block;width:calc(100% - 24px);margin:0 12px 16px;padding:14px;background:linear-gradient(135deg,var(--crimson),var(--crimson-dark));color:white;border:none;border-radius:10px;font-family:'M PLUS 1p',sans-serif;font-size:16px;font-weight:900;letter-spacing:2px;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(176,16,32,.3);}
  .save-btn:hover{transform:translateY(-2px);}
  .save-btn:disabled{opacity:.5;transform:none;cursor:not-allowed;}
  .ranking-view{padding:12px 12px 16px;}
  .rank-row{display:flex;align-items:center;padding:12px 14px;border-radius:10px;margin-bottom:8px;background:var(--cream);border:1px solid var(--sand);gap:12px;}
  .rank-row.rank-1{background:linear-gradient(90deg,#fff9e6,#fffdf5);border-color:var(--gold);}
  .rank-row.rank-2{background:linear-gradient(90deg,#f5f5f5,#fafafa);border-color:#aaa;}
  .rank-row.rank-3{background:linear-gradient(90deg,#fff3ee,#fffaf8);border-color:#cd7f32;}
  .rank-num{font-family:'Zen Antique Soft',serif;font-size:22px;min-width:32px;text-align:center;}
  .rank-1 .rank-num{color:var(--gold);}.rank-2 .rank-num{color:#888;}.rank-3 .rank-num{color:#cd7f32;}
  .rank-detail{flex:2;}
  .rank-name{font-size:16px;font-weight:900;}
  .rank-teams{font-size:11px;color:rgba(0,0,0,.5);line-height:1.8;margin-top:2px;}
  .rank-score{font-size:26px;font-weight:900;font-family:'Zen Antique Soft',serif;}
  .rank-score.plus{color:var(--crimson);}.rank-score.minus{color:#1a3a5c;}.rank-score.zero{color:#888;}
  .rank-score-label{font-size:11px;color:rgba(0,0,0,.4);font-weight:700;text-align:right;}
  .no-data{text-align:center;padding:40px 20px;color:rgba(0,0,0,.35);font-size:14px;line-height:2;}
  .rank-note{padding:0 12px 12px;font-size:11px;color:rgba(0,0,0,.4);text-align:center;line-height:1.8;}
  .reload-btn{display:block;margin:8px auto;padding:8px 20px;background:var(--sky);color:white;border:none;border-radius:20px;font-family:'M PLUS 1p',sans-serif;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:1px;}
  .admin-intro{padding:12px 16px;font-size:12px;color:rgba(0,0,0,.5);line-height:1.8;border-bottom:1px solid var(--sand);}
  .admin-team-list{padding:8px 12px 16px;}
  .admin-row{background:var(--cream);border-radius:10px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--sand);}
  .admin-team-name{font-size:14px;font-weight:900;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
  .pref-small{font-size:11px;font-weight:400;color:rgba(0,0,0,.4);}
  .admin-rounds{display:flex;flex-direction:column;gap:6px;}
  .admin-round-row{display:flex;align-items:center;gap:8px;}
  .admin-round-label{font-size:11px;font-weight:700;color:var(--sky);min-width:55px;}
  .score-inputs{display:flex;align-items:center;gap:6px;}
  .score-input{width:44px;height:32px;border:1.5px solid var(--sand);border-radius:8px;text-align:center;font-size:16px;font-weight:900;font-family:'M PLUS 1p',sans-serif;background:white;color:var(--ink);}
  .score-input:focus{outline:none;border-color:var(--crimson);}
  .score-vs{font-size:12px;font-weight:700;color:rgba(0,0,0,.3);}
  .score-diff-preview{font-size:13px;font-weight:900;min-width:40px;text-align:center;}
  .score-diff-preview.plus{color:var(--crimson);}.score-diff-preview.minus{color:#1a3a5c;}.score-diff-preview.zero{color:#888;}
  .admin-save-btn{display:block;width:calc(100% - 24px);margin:0 12px 16px;padding:13px;background:linear-gradient(135deg,#2d5a27,#4a7c4e);color:white;border:none;border-radius:10px;font-family:'M PLUS 1p',sans-serif;font-size:15px;font-weight:900;letter-spacing:2px;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(45,90,39,.3);}
  .admin-save-btn:hover{transform:translateY(-2px);}
  .admin-save-btn:disabled{opacity:.5;transform:none;cursor:not-allowed;}
  .admin-filter{display:flex;gap:6px;padding:10px 12px 4px;flex-wrap:wrap;}
  .filter-btn{padding:5px 12px;border-radius:20px;border:1.5px solid var(--sand);background:white;font-size:12px;font-weight:700;font-family:'M PLUS 1p',sans-serif;cursor:pointer;color:var(--ink);}
  .filter-btn.active{background:var(--sky);color:white;border-color:var(--sky);}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;align-items:center;justify-content:center;padding:16px;}
  .modal-overlay.open{display:flex;}
  .modal{background:white;border-radius:16px;width:100%;max-width:360px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:slideUp .25s ease;}
  @keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal-header{background:linear-gradient(135deg,var(--crimson-dark),var(--crimson));color:white;padding:16px 20px;}
  .m-pref{font-size:11px;opacity:.7;margin-bottom:2px;}.m-name{font-size:24px;font-weight:900;font-family:'Zen Antique Soft',serif;}.m-sub{font-size:11px;opacity:.6;margin-top:4px;line-height:1.6;}
  .modal-body{padding:16px;}
  .modal-sec-title{font-size:11px;font-weight:900;color:var(--crimson);letter-spacing:2px;margin-bottom:8px;margin-top:14px;}
  .modal-sec-title:first-child{margin-top:0;}
  .paper-grid{display:flex;gap:5px;}
  .paper-item{display:flex;flex-direction:column;align-items:center;background:var(--cream);border-radius:8px;padding:6px 8px;flex:1;}
  .paper-name{font-size:9px;color:rgba(0,0,0,.5);font-weight:700;margin-bottom:3px;text-align:center;}
  .paper-grade{font-size:15px;font-weight:900;}
  .pg-SA{color:#7a0a15;}.pg-A{color:#1a3a5c;}.pg-B{color:#4a7c4e;}.pg-C{color:#888;}
  .stat-games{font-size:11px;color:rgba(0,0,0,.4);margin-bottom:8px;font-weight:700;}
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
  .stat-item{background:var(--cream);border-radius:8px;padding:7px;text-align:center;}
  .stat-label{font-size:9px;color:rgba(0,0,0,.45);font-weight:700;margin-bottom:2px;}
  .stat-value{font-size:15px;font-weight:900;}
  .stat-top{color:var(--crimson);}.stat-bot{color:#1a3a5c;}
  .modal-close{display:block;width:100%;padding:12px;background:var(--ink);color:white;border:none;font-family:'M PLUS 1p',sans-serif;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:1px;}
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--ink);color:white;padding:12px 24px;border-radius:30px;font-size:14px;font-weight:700;transition:transform .3s ease;z-index:999;white-space:nowrap;}
  .toast.show{transform:translateX(-50%) translateY(0);}
  .view{display:none;}.view.active{display:block;}

  /* LOCK */
  .lock-banner{background:linear-gradient(90deg,#5a1a1a,#8b2020);color:white;padding:10px 16px;display:flex;align-items:center;gap:10px;margin:16px 0 0;border-radius:12px 12px 0 0;}
  .lock-banner-icon{font-size:20px;}
  .lock-banner-text{flex:1;font-size:13px;font-weight:700;letter-spacing:1px;}
  .lock-unlock-btn{padding:6px 14px;background:white;color:#8b2020;border:none;border-radius:20px;font-size:12px;font-weight:900;cursor:pointer;font-family:'M PLUS 1p',sans-serif;letter-spacing:1px;}
  .locked-overlay{background:#fff5f5;border:2px solid #e57373;border-radius:0 0 12px 12px;padding:20px;text-align:center;color:#8b2020;font-size:13px;font-weight:700;line-height:2;}

  /* PASSWORD MODAL */
  .pw-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;align-items:center;justify-content:center;padding:20px;}
  .pw-modal-overlay.open{display:flex;}
  .pw-modal{background:white;border-radius:16px;width:100%;max-width:320px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:slideUp .25s ease;}
  .pw-modal-header{background:linear-gradient(135deg,#2d5a27,#4a7c4e);color:white;padding:16px 20px;font-size:16px;font-weight:900;letter-spacing:1px;}
  .pw-modal-body{padding:20px;}
  .pw-label{font-size:12px;font-weight:700;color:rgba(0,0,0,.5);margin-bottom:8px;letter-spacing:1px;}
  .pw-input{width:100%;padding:12px;border:2px solid var(--sand);border-radius:10px;font-size:18px;font-weight:900;font-family:'M PLUS 1p',sans-serif;text-align:center;letter-spacing:4px;outline:none;}
  .pw-input:focus{border-color:var(--crimson);}
  .pw-error{color:var(--crimson);font-size:12px;font-weight:700;text-align:center;margin-top:8px;min-height:18px;}
  .pw-btns{display:flex;gap:8px;margin-top:16px;}
  .pw-btn{flex:1;padding:12px;border:none;border-radius:10px;font-family:'M PLUS 1p',sans-serif;font-size:14px;font-weight:900;cursor:pointer;letter-spacing:1px;}
  .pw-btn-ok{background:linear-gradient(135deg,var(--crimson),var(--crimson-dark));color:white;}
  .pw-btn-cancel{background:var(--sand);color:var(--ink);}

  /* ADMIN PASSWORD SECTION */
  .admin-pw-section{padding:12px 16px;border-bottom:1px solid var(--sand);background:#f9fdf9;}
  .admin-pw-row{display:flex;align-items:center;gap:10px;margin-top:8px;}
  .admin-pw-input{flex:1;padding:8px 12px;border:1.5px solid var(--sand);border-radius:8px;font-size:14px;font-weight:700;font-family:'M PLUS 1p',sans-serif;outline:none;}
  .admin-pw-input:focus{border-color:#4a7c4e;}
  .admin-pw-btn{padding:8px 16px;background:linear-gradient(135deg,#2d5a27,#4a7c4e);color:white;border:none;border-radius:8px;font-family:'M PLUS 1p',sans-serif;font-size:13px;font-weight:900;cursor:pointer;white-space:nowrap;}
  .lock-toggle-btn{display:flex;align-items:center;gap:8px;width:calc(100% - 24px);margin:0 12px 16px;padding:12px 16px;border:none;border-radius:10px;font-family:'M PLUS 1p',sans-serif;font-size:14px;font-weight:900;cursor:pointer;letter-spacing:1px;transition:all .2s;}
  .lock-toggle-btn.lock{background:linear-gradient(135deg,#8b2020,#5a1a1a);color:white;}
  .lock-toggle-btn.unlock{background:linear-gradient(135deg,#2d5a27,#4a7c4e);color:white;}
  .lock-toggle-btn{justify-content:center;}
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">データを読み込み中...</div>
</div>

<header>
  <div class="header-sub">SPRING TOURNAMENT 2026</div>
  <h1>🏆 センバツ甲子園<br>優勝予想大会</h1>
  <div class="header-badge">32校トーナメント</div>
</header>
<div class="sync-bar" id="sync-bar">⏳ クラウドに接続中...</div>
<div class="tabs-wrapper"><div class="tabs" id="tabs"></div></div>

<main>
<span class="team-count" id="selected-count">0</span> / 5チーム</div>
      <div class="teams-grid" id="teams-grid"></div>
    </div>
    <div class="section-card" id="selected-card" style="display:none">
      <div class="section-header">選択チームの<span>得失点差合計</span></div>
      <div class="selected-list" id="selected-list"></div>
      <button class="save-btn" id="save-member-btn" onclick="saveMember()">☁️ クラウドに保存する</button>
    </div>
  </div>

  <div class="view" id="view-rankings">
    <div class="section-card">
      <div class="section-header">🏅 <span>現在の順位表</span></div>
      <button class="reload-btn" onclick="loadCloud(true)">🔄 最新データに更新</button>
      <div class="ranking-view" id="ranking-view"></div>
      <div class="rank-note">得失点差の合計で順位を決定<br>試合結果は管理者タブから入力</div>
    </div>
  </div>

  <div class="view" id="view-admin">
    <div class="section-card">
      <div class="section-header admin-header">⚙️ 管理者｜<span>試合結果を入力</span></div>
      <!-- パスワード設定 -->
      <div class="admin-pw-section">
        <div style="font-size:12px;font-weight:900;color:#2d5a27;letter-spacing:2px;margin-bottom:6px;">🔑 管理者パスワード設定</div>
        <div style="font-size:11px;color:rgba(0,0,0,.5);margin-bottom:8px;">数字4桁でパスワードを設定してください</div>
        <div class="admin-pw-row">
          <input class="admin-pw-input" type="number" id="new-pw-input" placeholder="新しいパスワード（4桁）" maxlength="4" style="letter-spacing:4px;font-size:18px;text-align:center;">
          <button class="admin-pw-btn" onclick="setPassword()">設定</button>
        </div>
        <div id="pw-set-msg" style="font-size:11px;margin-top:6px;color:#2d5a27;font-weight:700;min-height:16px;"></div>
      </div>
      <!-- ロック切り替え -->
      <div style="padding:12px 12px 4px;">
        <button class="lock-toggle-btn" id="lock-toggle-btn" onclick="toggleLock()">🔒 チーム選択をロックする</button>
      </div>
      <div class="admin-intro">各チームの試合スコアを入力してください。<br>得点 − 失点 = 得失点差として自動計算されます。</div>
      <div class="admin-filter" id="admin-filter"></div>
      <div class="admin-team-list" id="admin-team-list"></div>
      <button class="admin-save-btn" id="admin-save-btn" onclick="saveAdmin()">☁️ 結果をクラウドに保存</button>
    </div>
  </div>
</main>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="m-pref" id="m-pref"></div>
      <div class="m-name" id="m-name"></div>
      <div class="m-sub" id="m-sub"></div>
    </div>
    <div class="modal-body">
      <div class="modal-sec-title">📰 新聞社評価</div>
      <div class="paper-grid" id="m-papers"></div>
      <div class="modal-sec-title">⚾ 公式戦成績</div>

// ===== クラウド読み込み =====
async function loadCloud(silent=false){
  if(!silent)showLoading(true,'データを読み込み中...');
  setSyncBar('syncing');
  try{
    const data=await cloudRead();
    if(data&&typeof data==='object'){cloud=data;}
    setSyncBar('ok');

    renderLockState();
  }catch(e){
    console.error(e);
    setSyncBar('error','⚠️ 読み込み失敗 - オフラインで動作中');
    showToast('⚠️ クラウドへの接続に失敗しました');
    renderCurrent();
    renderLockState();
  }finally{
    showLoading(false);
  }
}

  });

function switchView(v){
  cur='__'+v+'__';

function renderCurrent(){

function gradeCls(g){return g==='特A'?'SA':g;}
function renderGrid(){

function toggleTeam(no){

}

// ===== 得失点差 =====
function calcTeamDiff(no){
  const res=gr(),key=String(no);if(!res[key])return null;
  let total=0,played=false;
  ROUNDS.forEach(r=>{const rd=res[key][r.key];if(rd&&rd.scored!==''&&rd.lost!=''){total+=parseInt(rd.scored||0)-parseInt(rd.lost||0);played=true;}});
  return played?total:null;
}
function calcMemberTotal(m){
  const data=gm(m);let total=0,played=false;
  data.teams.forEach(no=>{const d=calcTeamDiff(no);if(d!==null){total+=d;played=true;}});
  return played?total:null;
}

// ===== SELECTED LIST =====
function renderSelectedList(){
  if(!MEMBERS.includes(cur))return;
  const data=gm(cur);const list=document.getElementById('selected-list');if(!list)return;list.innerHTML='';
  let grand=0,anyPlayed=false;
  data.teams.forEach(no=>{
    const t=TEAMS.find(x=>x.no===no),diff=calcTeamDiff(no);
    if(diff!==null){anyPlayed=true;grand+=diff;}
    const cls=diff===null?'zero':diff>0?'plus':diff<0?'minus':'zero';
    const disp=diff===null?'－':diff>0?`+${diff}`:String(diff);
    const res=gr()[String(no)]||{};
    const badges=ROUNDS.map(r=>{const rd=res[r.key],p=rd&&rd.scored!==''&&rd.lost!='';return`<span class="sel-round-badge${p?' played':''}">${r.label.slice(0,3)}</span>`;}).join('');
    list.innerHTML+=`<div class="sel-item"><div style="flex:1"><div class="sel-name">${t.name}</div><div class="sel-rounds">${badges}</div></div><div class="sel-diff ${cls}">${disp}</div></div>`;
  });
  if(data.teams.length>0){
    const tcls=!anyPlayed?'zero':grand>0?'plus':grand<0?'minus':'zero';
    const tdisp=!anyPlayed?'試合待ち':grand>0?`+${grand}`:String(grand);
    list.innerHTML+=`<div class="sel-item" style="border-color:var(--crimson);background:#fff5f5"><div style="flex:1"><div class="sel-name" style="color:var(--crimson)">合計得失点差</div></div><div class="sel-diff ${tcls}" style="font-size:24px">${tdisp}</div></div>`;
  }
}

// ===== RANKINGS =====
function renderRankings(){
  const view=document.getElementById('ranking-view');
  const scores=MEMBERS.map(m=>{
    const data=gm(m),total=calcMemberTotal(m);
    const names=data.teams.map(no=>{const t=TEAMS.find(x=>x.no===no),d=calcTeamDiff(no);return t?`${t.name}${d===null?'':d>0?`(+${d})`:`(${d})`}`:''});
    return{member:m,total,teams:names,count:data.teams.length};
  }).sort((a,b)=>a.total===null&&b.total===null?0:a.total===null?1:b.total===null?-1:b.total-a.total);
  if(!scores.some(s=>s.count>0)){view.innerHTML='<div class="no-data">まだ誰も選択していません 🌸<br>各参加者のタブからチームを選んでください</div>';return;}
  view.innerHTML='';
  scores.forEach((s,i)=>{
    const row=document.createElement('div');
    row.className='rank-row'+(i===0?' rank-1':i===1?' rank-2':i===2?' rank-3':'');
    const disp=s.total===null?'試合待':s.total>0?`+${s.total}`:String(s.total);
    const sc=s.total===null?'zero':s.total>0?'plus':s.total<0?'minus':'zero';
    row.innerHTML=`<div class="rank-num">${['🥇','🥈','🥉'][i]||(i+1)}</div><div class="rank-detail"><div class="rank-name">${s.member}</div><div class="rank-teams">${s.teams.length>0?s.teams.join('　'):'未選択'}</div></div><div style="text-align:right"><div class="rank-score ${sc}">${disp}</div><div class="rank-score-label">得失点差</div></div>`;
    view.appendChild(row);
  });
}

  const res=gr(),teamList=document.getElementById('admin-team-list');teamList.innerHTML='';
  TEAMS.forEach(t=>{
    const tRes=res[String(t.no)]||{};
    const hasAny=ROUNDS.some(r=>{const rd=tRes[r.key];return rd&&(rd.scored!==''||rd.lost!='');});
    if(adminFilter==='未入力'&&hasAny)return;
    if(adminFilter==='入力済'&&!hasAny)return;
    const row=document.createElement('div');row.className='admin-row';
    row.innerHTML=`<div class="admin-team-name">No.${t.no} ${t.name} <span class="pref-small">${t.pref}</span></div><div class="admin-rounds" id="ar-${t.no}"></div>`;
    teamList.appendChild(row);
    const roundsEl=row.querySelector(`#ar-${t.no}`);
    ROUNDS.forEach(r=>{
      const rd=tRes[r.key]||{scored:'',lost:''};
      const diff=rd.scored!==''&&rd.lost!=''?parseInt(rd.scored)-parseInt(rd.lost):null;
      const dcls=diff===null?'zero':diff>0?'plus':diff<0?'minus':'zero';
      const dtxt=diff===null?'':diff>0?`+${diff}`:String(diff);
      const rrow=document.createElement('div');rrow.className='admin-round-row';
      rrow.innerHTML=`<div class="admin-round-label">${r.label}</div><div class="score-inputs"><input class="score-input" type="number" min="0" max="99" placeholder="得" value="${rd.scored}" id="inp-${t.no}-${r.key}-s" oninput="updatePrev(${t.no},'${r.key}')"><span class="score-vs">対</span><input class="score-input" type="number" min="0" max="99" placeholder="失" value="${rd.lost}" id="inp-${t.no}-${r.key}-l" oninput="updatePrev(${t.no},'${r.key}')"><span class="score-diff-preview ${dcls}" id="prev-${t.no}-${r.key}">${dtxt}</span></div>`;
      roundsEl.appendChild(rrow);
    });
  });
}
function setFilter(f){adminFilter=f;renderAdmin();}
function updatePrev(no,rkey){
  const s=document.getElementById(`inp-${no}-${rkey}-s`).value,l=document.getElementById(`inp-${no}-${rkey}-l`).value;
  const prev=document.getElementById(`prev-${no}-${rkey}`);
  if(s===''||l===''){prev.textContent='';prev.className='score-diff-preview zero';return;}
  const d=parseInt(s)-parseInt(l);prev.textContent=d>0?`+${d}`:String(d);prev.className='score-diff-preview '+(d>0?'plus':d<0?'minus':'zero');
}
async function saveAdmin(){
  const res=gr();
  TEAMS.forEach(t=>{
    ROUNDS.forEach(r=>{
      const si=document.getElementById(`inp-${t.no}-${r.key}-s`),li=document.getElementById(`inp-${t.no}-${r.key}-l`);
      if(!si||!li)return;
      if(!res[String(t.no)])res[String(t.no)]={};
      res[String(t.no)][r.key]={scored:si.value,lost:li.value};
    });
  });
  setBtnDisabled('admin-save-btn',true);
  document.getElementById('admin-save-btn').textContent='保存中...';
  const ok=await saveCloud();
  if(ok)showToast('✅ 試合結果を保存しました！');
  document.getElementById('admin-save-btn').textContent='☁️ 結果をクラウドに保存';
  setBtnDisabled('admin-save-btn',false);
}

// ===== MODAL =====
function openModal(no){
  const t=TEAMS.find(x=>x.no===no);
  document.getElementById('m-pref').textContent=t.pref;
  document.getElementById('m-name').textContent=t.name;
  document.getElementById('m-sub').textContent=`${t.history}　神宮：${t.jingu}`;
  document.getElementById('m-papers').innerHTML=[{n:'日刊',g:t.papers.nikkan},{n:'スポニチ',g:t.papers.spo},{n:'報知',g:t.papers.hochi},{n:'サンスポ',g:t.papers.san},{n:'デイリー',g:t.papers.daily}].map(p=>`<div class="paper-item"><div class="paper-name">${p.n}</div><div class="paper-grade pg-${gradeCls(p.g)}">${p.g}</div></div>`).join('');
  document.getElementById('m-games').textContent=`公式戦 ${t.stats.games}試合`;
  const sorted={};['avg','run','hr','sb','era','ra','err'].forEach(k=>{sorted[k]=TEAMS.map(t=>({no:t.no,v:t.stats[k]})).sort((a,b)=>a.v-b.v);});
  function getRank(k,no){const asc=['era','ra','err'].includes(k),idx=sorted[k].findIndex(x=>x.no===no);return asc?(idx<5?'top':idx>=27?'bot':''):(idx>=27?'top':idx<5?'bot':'');}
  document.getElementById('m-stats').innerHTML=[{l:'チーム打率',v:'.'+t.stats.avg,k:'avg'},{l:'平均得点',v:t.stats.run+'点',k:'run'},{l:'本塁打',v:t.stats.hr+'本',k:'hr'},{l:'盗塁',v:t.stats.sb+'個',k:'sb'},{l:'防御率',v:t.stats.era,k:'era'},{l:'平均失点',v:t.stats.ra+'点',k:'ra'},{l:'失策',v:t.stats.err+'個',k:'err'}].map(s=>{const r=getRank(s.k,no);return`<div class="stat-item"><div class="stat-label">${s.l}</div><div class="stat-value ${r==='top'?'stat-top':r==='bot'?'stat-bot':''}">${r==='top'?'🔴':r==='bot'?'🔵':''}${s.v}</div></div>`;}).join('');
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(e){if(e.target.id==='modal-overlay')closeModalBtn();}
function closeModalBtn(){document.getElementById('modal-overlay').classList.remove('open');}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}

// ===== 起動 =====
buildTabs();
loadCloud();
</script>
</body>
